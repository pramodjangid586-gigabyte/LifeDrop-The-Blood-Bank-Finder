{% extends "base.html" %}

{% block title %}Login – BloodConnect Emergency Platform{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">

    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center text-2xl mx-auto">
                🩸
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Sign In to BloodConnect</h1>
            <p class="text-xs text-slate-500">Access your emergency dashboard and requests</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1.5">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@example.com"
                       class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold uppercase text-slate-700">Password</label>
                    <a href="/forgot-password" class="text-xs font-semibold text-red-600 hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••"
                       class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500">
            </div>

            <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl shadow-md shadow-red-600/20 transition text-sm">
                Sign In
            </button>
        </form>

        <!-- Quick 1-Click Role Logins for Testing & Review -->
        <div class="pt-4 border-t border-slate-100 space-y-2">
            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 text-center">
                Demo 1-Click Role Logins:
            </span>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="fillAndLogin('admin@bloodconnect.org', 'admin123')" class="p-2 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-lg font-bold text-left transition">
                    👑 Admin
                </button>
                <button onclick="fillAndLogin('staff.aiims@bloodconnect.org', 'staff123')" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg font-bold text-left transition">
                    🏥 AIIMS Staff
                </button>
                <button onclick="fillAndLogin('priya.donor@gmail.com', 'donor123')" class="p-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg font-bold text-left transition">
                    🩸 Donor (O+)
                </button>
                <button onclick="fillAndLogin('rahul.patient@gmail.com', 'patient123')" class="p-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-lg font-bold text-left transition">
                    👤 Patient
                </button>
            </div>
        </div>

        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            Don't have an account yet?
            <a href="/register" class="font-bold text-red-600 hover:underline">Register Now</a>
        </div>
    </div>

</div>

<script>
async function fillAndLogin(email, pwd) {
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = pwd;
    await doLogin(email, pwd);
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const pwd = document.getElementById('login-password').value;
    await doLogin(email, pwd);
}

async function doLogin(email, password) {
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        const data = await res.json();
        if (res.ok) {
            showToast("Logged in successfully! Redirecting...", "success");
            setTimeout(() => window.location.href = data.redirect_url || '/dashboard/user', 800);
        } else {
            showToast(data.detail || "Invalid credentials", "error");
        }
    } catch (err) {
        showToast("Login error: " + err.message, "error");
    }
}
</script>
{% endblock %}
