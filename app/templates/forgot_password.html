{% extends "base.html" %}

{% block title %}Forgot Password | LifeDrop{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Password Recovery</h1>
            <p class="text-xs text-slate-500">Enter your registered email to receive a password reset token.</p>
        </div>

        <form onsubmit="handleForgot(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1.5">Registered Email</label>
                <input type="email" id="forgot-email" required placeholder="name@example.com"
                    class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-500">
            </div>

            <button type="submit"
                class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold rounded-xl shadow-md transition text-sm">
                Send Recovery Instructions
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            Remember your credentials?
            <a href="/login" class="font-bold text-red-600 hover:underline">Sign In</a>
        </div>
    </div>
</div>

<script>
    async function handleForgot(e) {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value;
        try {
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await res.json();
            showToast(data.message, "info");
        } catch (e) {
            showToast("Error sending recovery link.", "error");
        }
    }
</script>
{% endblock %}
